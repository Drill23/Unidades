<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#f7f4ef" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Unidades" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>Unidades</title>
    <style>
      :root {
        background: #f7f4ef;
        color: #1d2a2e;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background:
          linear-gradient(135deg, rgba(105, 181, 120, 0.15), transparent 38%),
          linear-gradient(315deg, rgba(93, 138, 168, 0.13), transparent 42%),
          #f7f4ef;
        touch-action: manipulation;
      }

      iframe {
        border: 0;
        height: 100dvh;
        width: 100vw;
      }

      .fallback {
        align-items: center;
        display: none;
        height: 100%;
        justify-items: center;
        padding: 22px;
        text-align: center;
      }

      .fallback a {
        background: #1d2a2e;
        border-radius: 8px;
        color: #fff;
        display: inline-flex;
        font-weight: 800;
        margin-top: 16px;
        padding: 12px 16px;
        text-decoration: none;
      }

      .failed iframe {
        display: none;
      }

      .failed .fallback {
        display: grid;
      }
    </style>
  </head>
  <body>
    <iframe
      allow="clipboard-read; clipboard-write"
      referrerpolicy="no-referrer-when-downgrade"
      src="https://script.google.com/macros/s/AKfycbzKBQlkB3c4EBu7FAeoF-TUHxEsGH43rVZ32r54H3QxmXrukF-wiB9xmt0uQYB0s7n8/exec"
      title="Unidades"
    ></iframe>
    <main class="fallback">
      <section>
        <h1>Unidades</h1>
        <p>Se o app não abrir embutido, use o botão abaixo.</p>
        <a href="https://script.google.com/macros/s/AKfycbzKBQlkB3c4EBu7FAeoF-TUHxEsGH43rVZ32r54H3QxmXrukF-wiB9xmt0uQYB0s7n8/exec">Abrir app</a>
      </section>
    </main>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }
      setTimeout(() => {
        const frame = document.querySelector('iframe');
        if (!frame || !frame.contentWindow) document.body.classList.add('failed');
      }, 5000);
    </script>
  </body>
</html>
